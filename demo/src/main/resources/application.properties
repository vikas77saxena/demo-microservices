spring.application.name=demo
spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=postgres
spring.datasource.password=lucknow
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health,info

logging.file.name=app.log
logging.file.path=D:\Demo Microservices\demo
logging.level.root=INFO
spring.jvm.args=-Dfile.encoding=UTF-8

# Loads application-local.yaml for AWS keys (+ and / must be quoted in YAML, not .properties)
spring.profiles.active=local

# AWS S3 — Excel upload only (via /readexcelfile)
aws.s3.enabled=true
aws.s3.bucket-name=vikas-bucket-test-file-upload
# Must match bucket region (app auto-detects on startup if this is wrong)
aws.s3.region=ap-south-1
aws.s3.excel.local-path=D:/courses.xlsx
aws.s3.excel.key=courses/uploads/courses.xlsx



